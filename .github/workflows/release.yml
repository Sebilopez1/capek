# Publish capek-tech to PyPI with trusted publishing (OIDC): no API tokens or secrets are stored.
# It also publishes the one-off redirect package `robot-report-card` 0.2.0 (redirect/), which only installs
# capek-tech; skip-existing makes later releases leave it alone.
# Both PyPI projects need a trusted publisher for repository <owner>/capek, workflow release.yml,
# environment pypi (and the same on TestPyPI with environment testpypi for the dry run). See docs/dev/RELEASE.md.
# The publish job only starts when a GitHub release is published, and then waits for the `pypi` approval.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:  # TestPyPI dry run only

permissions:
  contents: read

jobs:
  build:
    name: build + check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to build while the owner placeholder is present (PyPI versions can never be re-uploaded)
        run: python3 tools/set_github_owner.py --check
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - name: Build the robot-report-card redirect package
        run: uv build redirect --out-dir dist-redirect
      - name: twine check
        run: uvx twine check --strict dist/* dist-redirect/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dist-redirect
          path: dist-redirect/
          if-no-files-found: error

  testpypi:
    name: publish to TestPyPI (dry run)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/capek-tech
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/capek-tech
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The robot-report-card redirect gets its own jobs so a failed upload (e.g. its publisher not yet repointed to
  # repository capek) can be re-run alone without re-uploading capek-tech.
  testpypi-redirect:
    name: publish robot-report-card redirect to TestPyPI (dry run)
    if: github.event_name == 'workflow_dispatch'
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/robot-report-card
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-redirect
          path: dist-redirect/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist-redirect/
          skip-existing: true

  pypi-redirect:
    name: publish robot-report-card redirect to PyPI
    if: github.event_name == 'release'
    needs: pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/robot-report-card
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-redirect
          path: dist-redirect/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-redirect/
          skip-existing: true
